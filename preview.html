<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<title>Luna Residence — Desktop / Mobile preview</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #E4DFD5; font-family: 'Jost', Helvetica, sans-serif; }
  .wrap { display: flex; flex-wrap: nowrap; gap: 20px; align-items: flex-start; justify-content: center; padding: 20px; }
  .col { display: flex; flex-direction: column; gap: 10px; flex: none; }
  .cap { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
  .cap b { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #20201D; font-weight: 500; }
  .cap span { font-size: 10px; letter-spacing: .14em; color: #6F6B63; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<div class="wrap">

  <div class="col">
    <div class="cap"><b>Mobile</b><span>370 × 812 · prikaz 80%</span></div>
    <div style="width:316px; padding:10px; box-sizing:border-box; background:#20201D; border-radius:26px; line-height:0; box-shadow:0 40px 90px -50px rgba(32,32,29,.6);">
      <div style="width:296px; height:650px; overflow:hidden; border-radius:18px; background:#F7F4EE; display:block; line-height:0;">
        <iframe src="index.html" title="Luna Residence — mobilni prikaz" style="width:370px; height:812px; transform:scale(.8); transform-origin:top left;"></iframe>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="cap"><b>Desktop</b><span>1440 × 900 · prikaz 32%</span></div>
    <div style="width:461px; height:288px; overflow:hidden; border:1px solid #C8BDAE; background:#F7F4EE; box-shadow:0 40px 90px -50px rgba(32,32,29,.5);">
      <iframe src="index.html" title="Luna Residence — desktop prikaz" style="width:1440px; height:900px; transform:scale(.32); transform-origin:top left;"></iframe>
    </div>
  </div>

</div>
</body>
</html>
